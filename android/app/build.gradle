plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def pythonHome = System.getenv('LOCALAPPDATA') + '/Programs/Python/Python313/python.exe'
if (!file(pythonHome).exists()) {
    pythonHome = 'python'
}

android {
    namespace 'org.miigaik.geocalc'
    compileSdk 34
    defaultConfig {
        applicationId 'org.miigaik.geocalc'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython pythonHome
        pip {
            install 'fpdf2'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
